name: Bug Report
description: Report a problem
title: ""
labels:
  - bug

body:
  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: Please describe the problem.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Please describe how to reproduce the problem.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: What did you expect to happen?